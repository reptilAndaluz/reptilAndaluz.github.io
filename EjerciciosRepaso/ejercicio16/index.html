<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 16 · Celsius a Fahrenheit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <a class="volver" href="../index.html">← Índice de ejercicios</a>
    <h1>Ejercicio 16: Celsius a Fahrenheit</h1>
    <p class="enunciado">Escribe una función que convierta grados Celsius a Fahrenheit. Fórmula: Fahrenheit = (Celsius * 9/5) + 32.</p>

    <form id="formulario">
      <label>Grados Celsius<input id="celsius" type="number" step="any" required value="25"></label>
      <button type="submit">Ejecutar</button>
    </form>

    <h2>Resultado</h2>
    <div id="resultado" class="salida" aria-live="polite"></div>
    <p class="nota">Abre las DevTools (F12) → Consola para ver también la salida por consola.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
