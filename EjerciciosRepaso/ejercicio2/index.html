<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 2 · Array aleatorio y filtrado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <a class="volver" href="../index.html">← Índice de ejercicios</a>
    <h1>Ejercicio 2: Array aleatorio y filtrado</h1>
    <p class="enunciado">Declara un array de 100 números y rellénalo con valores al azar. Muéstralo con console.table. Filtra los valores de un rango determinado.</p>

    <form id="formulario">
      <label>Mínimo<input id="min" type="number" value="20"></label><label>Máximo<input id="max" type="number" value="60"></label>
      <button type="submit">Ejecutar</button>
    </form>

    <h2>Resultado</h2>
    <div id="resultado" class="salida" aria-live="polite"></div>
    <p class="nota">Abre las DevTools (F12) → Consola para ver también la salida por consola.</p>
  </main>
  <script src="script.js"></script>
</body>
