<head>

<body>
  <main class="card">
    <a class="volver" href="../index.html">← Índice de ejercicios</a>
    <h1>Ejercicio 12: Filtrar números pares</h1>
    <p class="enunciado">Crea una función que tome un array de números y devuelva un nuevo array con solo los números pares. Usa filter() y el operador %.</p>

    <form id="formulario">
      <label>Números separados por comas<input id="lista" type="text" required value="1, 2, 3, 4, 5, 6, 7, 8"></label>
      <button type="submit">Ejecutar</button>
    </form>

    <h2>Resultado</h2>
    <div id="resultado" class="salida" aria-live="polite"></div>
    <p class="nota">Abre las DevTools (F12) → Consola para ver también la salida por consola.</p>
