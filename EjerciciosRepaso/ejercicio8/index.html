<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 8 · Número aleatorio en un intervalo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <a class="volver" href="../index.html">← Índice de ejercicios</a>
    <h1>Ejercicio 8: Número aleatorio en un intervalo</h1>
    <p class="enunciado">Escribe una función que genere un número aleatorio entero entre un intervalo. Por ejemplo azar(-5, 10). Salida: 3.</p>

    <form id="formulario">
      <label>Mínimo<input id="min" type="number" value="-5" required></label><label>Máximo<input id="max" type="number" value="10" required></label>
      <button type="submit">Ejecutar</button>
    </form>

    <h2>Resultado</h2>
    <div id="resultado" class="salida" aria-live="polite"></div>
    <p class="nota">Abre las DevTools (F12) → Consola para ver también la salida por consola.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
